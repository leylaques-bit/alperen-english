<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alperen's English</title>
<style>
  :root{
    --ink:#1c2430; --paper:#f6f1e7; --card:#ffffff;
    --sun:#e8973a; --sky:#3a7ca5; --leaf:#5b8c5a; --wrong:#c15b4a;
    --gold:#d9a441; --rose:#c9788f; --shadow:rgba(28,36,48,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:var(--card)}
  body{
    font-family:"Georgia",serif; background:var(--paper); color:var(--ink);
    display:flex; flex-direction:column; overflow:hidden;
    -webkit-font-smoothing:antialiased;
    position:fixed; inset:0;
  }
  .sans{font-family:"Helvetica Neue",Arial,sans-serif}
  header{
    padding:calc(env(safe-area-inset-top) + 14px) 20px 8px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
  }
  .brand{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:.13em;
    text-transform:uppercase;font-size:13px;color:var(--sky)}
  .streak{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:600;color:var(--sun)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 20px 20px;min-height:0}
  .wrap{max-width:460px;margin:0 auto;width:100%}

  h1{font-size:28px;line-height:1.12;margin-bottom:8px}
  h2{font-size:21px;margin:4px 0 12px}
  .muted{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;color:#7d7669;line-height:1.5}

  .love{background:linear-gradient(150deg,#fff2f5,#ffe9ef);border:1.5px solid #f4d3dd;border-radius:18px;
    padding:15px 18px;margin-bottom:16px;font-family:"Helvetica Neue",Arial,sans-serif}
  .love .from{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:700;margin-bottom:6px}
  .love .msg{font-size:15px;line-height:1.5;color:#5a4750;font-style:italic}

  .tile{background:var(--card);border:none;border-radius:20px;box-shadow:0 10px 26px var(--shadow);
    padding:20px;margin-bottom:14px;width:100%;text-align:left;cursor:pointer;display:block}
  .tile:active{transform:scale(.99)}
  .tile .em{font-size:26px;display:block;margin-bottom:8px}
  .tile .t{font-family:"Helvetica Neue",Arial,sans-serif;font-size:18px;font-weight:700}
  .tile .s{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:#98928a;margin-top:3px;line-height:1.45}
  .tile-row{display:flex;align-items:center;gap:14px}
  .tile-row .em{margin:0}
  .tile-row .grow{flex:1}
  .badge-pill{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:100px;background:#eef3ee;color:var(--leaf);white-space:nowrap}
  .badge-pill.todo{background:#f0e9db;color:#98928a}

  .btn{width:100%;border:none;border-radius:100px;padding:16px;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:12px}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--sky);color:#fff}
  .btn-leaf{background:var(--leaf);color:#fff}
  .btn-sun{background:var(--sun);color:#fff}
  .btn-rose{background:var(--rose);color:#fff}
  .btn-ghost{background:#e9e1d1;color:var(--ink)}
  .btn-sm{padding:12px;font-size:14px}

  .progress{height:6px;background:#e4ddcf;border-radius:3px;overflow:hidden;margin:6px 0 18px}
  .progress-bar{height:100%;width:0%;background:var(--sun);border-radius:3px;transition:width .35s ease}

  .qcard{background:var(--card);border-radius:24px;box-shadow:0 14px 34px var(--shadow);padding:24px 20px}
  .qlabel{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.15em;
    text-transform:uppercase;color:#98928a;font-weight:600;text-align:center}
  .qpic{font-size:70px;text-align:center;margin:8px 0 4px;min-height:78px;display:flex;align-items:center;justify-content:center;user-select:none}
  .qword{font-size:28px;font-weight:700;text-align:center;line-height:1.2}
  .qword.small{font-size:21px;font-weight:600;line-height:1.45}
  .qword .blank{color:var(--sun);border-bottom:3px solid var(--sun);padding:0 20px}
  .say{margin:12px auto 0;background:none;border:1.5px solid #e0d8c8;border-radius:100px;padding:9px 20px;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:7px}
  .say:active{background:#f6f1e7}
  .say.big{font-size:17px;padding:14px 26px;margin-top:4px}
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
  .opt{width:100%;background:#faf6ee;border:1.5px solid #ece4d4;border-radius:16px;padding:15px;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:17px;font-weight:600;color:var(--ink);cursor:pointer;
    transition:background .15s,border-color .15s;text-align:center}
  .opt:active{background:#f1eadc}
  .opt.correct{background:#e7f0e2;border-color:var(--leaf);color:var(--leaf)}
  .opt.wrong{background:#f6e3df;border-color:var(--wrong);color:var(--wrong)}
  .opt.dim{opacity:.45}
  .opt:disabled{cursor:default}
  .explain{font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;
    background:#f3ede0;border-radius:14px;padding:14px;margin-top:16px;color:#5a5346;display:none}
  .explain.show{display:block}
  .explain b{color:var(--ink)}

  /* sentence build chips */
  .build-area{min-height:60px;background:#f3ede0;border-radius:14px;padding:12px;margin-top:16px;
    display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
  .build-area:empty::before{content:"Kelimelere dokun ↓";color:#b7ae9f;font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px}
  .bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .chip{font-family:"Helvetica Neue",Arial,sans-serif;font-size:16px;font-weight:600;padding:10px 14px;
    border-radius:12px;border:1.5px solid #e0d8c8;background:#fffdf9;cursor:pointer}
  .chip:active{transform:scale(.95)}
  .chip.used{opacity:.3;pointer-events:none}
  .chip.inbuild{background:#eef3fa;border-color:#bcd4e6}

  .spell-in{width:100%;font-family:"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:700;
    text-align:center;padding:14px;border:2px solid #e0d8c8;border-radius:16px;background:#fffdf9;color:var(--ink);
    letter-spacing:.06em;margin-top:18px}
  .spell-in:focus{outline:none;border-color:var(--sky)}
  .hint-letters{font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.32em;font-size:20px;color:#b7ae9f;text-align:center;margin-top:12px}

  .teach{background:var(--card);border-radius:24px;box-shadow:0 14px 34px var(--shadow);padding:24px 22px;margin-bottom:16px}
  .teach h3{font-size:20px;margin-bottom:10px;color:var(--sky)}
  .teach p{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.6;margin-bottom:12px;color:#3a3630}
  .teach .rule{background:#eef3fa;border-left:4px solid var(--sky);border-radius:8px;padding:12px 14px;margin-bottom:12px;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.55;color:#2a3a46}
  .teach .ex{background:#f3ede0;border-radius:12px;padding:11px 14px;margin-bottom:9px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px}
  .teach .ex .en{font-weight:700}
  .teach .ex .tr{color:#7d7669;font-size:13px;margin-top:2px}
  .teach .tip{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:#9a7a3a;background:#fbf3e2;border-radius:10px;padding:10px 12px;margin-top:6px}

  .result{text-align:center;padding-top:20px}
  .result .big{font-size:60px;margin-bottom:6px}
  .result h2{font-size:28px}
  .result .lvl{display:inline-block;background:var(--gold);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;
    font-weight:700;font-size:22px;padding:8px 22px;border-radius:100px;margin:10px 0 4px;letter-spacing:.05em}

  .ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
  .ach{background:var(--card);border-radius:18px;box-shadow:0 8px 20px var(--shadow);padding:16px 12px;text-align:center}
  .ach.locked{opacity:.4;filter:grayscale(1)}
  .ach .ico{font-size:34px}
  .ach .nm{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;font-weight:700;margin-top:6px}
  .ach .ds{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:#98928a;margin-top:2px;line-height:1.35}

  .stats{display:flex;gap:12px;margin-bottom:18px}
  .stat{flex:1;background:var(--card);border-radius:16px;box-shadow:0 8px 20px var(--shadow);padding:14px;text-align:center}
  .stat .n{font-family:"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:800;color:var(--sky)}
  .stat .l{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:#98928a;text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

  .catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .catbtn{background:var(--card);border:none;border-radius:16px;box-shadow:0 8px 20px var(--shadow);padding:18px 12px;text-align:center;cursor:pointer}
  .catbtn:active{transform:scale(.98)}
  .catbtn .ci{font-size:28px}
  .catbtn .cn{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;font-weight:700;margin-top:6px}
  .catbtn .cc{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;color:#98928a;margin-top:2px}

  .lvlrow{display:flex;gap:8px;margin:2px 0 16px}
  .lvlchip{flex:1;background:#e9e1d1;border:none;border-radius:100px;padding:10px;font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;font-weight:700;cursor:pointer;color:#6d665a}
  .lvlchip.on{background:var(--sky);color:#fff}

  .wordlist{display:flex;flex-direction:column;gap:8px}
  .wrow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;box-shadow:0 6px 16px var(--shadow);padding:12px 14px}
  .wrow .wtext{flex:1;min-width:0}
  .wrow .ww{font-family:"Helvetica Neue",Arial,sans-serif;font-size:17px;font-weight:700}
  .wrow .wtr{font-family:"Helvetica Neue",Arial,sans-serif;font-size:13px;color:#7d7669;margin-top:2px}
  .wrow .wl{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;color:#fff;background:var(--gold);border-radius:100px;padding:2px 8px}
  .wrow .wsay{background:none;border:none;font-size:20px;cursor:pointer}

  .codebox{width:100%;font-family:"Courier New",monospace;font-size:12px;line-height:1.5;
    border:2px solid #e0d8c8;border-radius:14px;padding:14px;background:#fffdf9;color:#5a5346;resize:none;height:110px;margin-bottom:12px}
  .codebox:focus{outline:none;border-color:var(--sky)}

  nav{display:flex;flex-shrink:0;background:var(--card);box-shadow:0 -4px 20px rgba(28,36,48,.08);
    padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;background:none;border:none;padding:7px 2px;cursor:pointer;
    font-family:"Helvetica Neue",Arial,sans-serif;font-size:10.5px;color:#a49d92;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button .ni{font-size:21px;line-height:1}
  nav button.active{color:var(--sky);font-weight:700}
  .toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%) translateY(-20px);
    background:var(--ink);color:#fff;font-family:"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:600;
    padding:12px 20px;border-radius:100px;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:all .35s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none !important}
  .center{text-align:center}
  .sp{height:8px}
  .back{background:none;border:none;font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;color:var(--sky);
    cursor:pointer;padding:4px 0;margin-bottom:8px;font-weight:600}
  .feedbar{text-align:center;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:15px;margin-top:14px;min-height:22px}
  .feedbar.ok{color:var(--leaf)}
  .feedbar.no{color:var(--wrong)}
</style>
</head>
<body>
  <header>
    <span class="brand">Alperen's English</span>
    <span class="streak" id="streak">🔥 0</span>

  <main><div class="wrap" id="view"></div></main>

    <button data-tab="home" class="active"><span class="ni">🏠</span>Ana Sayfa</button>

  </nav>

const DEFAULT_STATE={
  level:null,xp:0,streak:0,lastActive:null,
  lessonsDone:[],gamesPlayed:0,correctTotal:0,perfectRounds:0,
  spellDone:0,listenDone:0,sentencesDone:0,wordsStudied:0,achievements:[]
};
let S={...DEFAULT_STATE};
const STORE_KEY="alperen_english_state";
async function loadState(){
  let loaded=false;
  // Primary: browser localStorage (works in Safari + Home Screen apps)
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw){S={...DEFAULT_STATE,...JSON.parse(raw)};loaded=true;}
  }catch(e){}
  // Fallback: Claude artifact storage (only when running inside Claude)
  if(!loaded && typeof window!=="undefined" && window.storage){
    try{const r=await window.storage.get("state");if(r&&r.value){S={...DEFAULT_STATE,...JSON.parse(r.value)};}}catch(e){}
  }
  handleStreak();
}
async function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){}
  if(typeof window!=="undefined" && window.storage){
    try{ await window.storage.set("state", JSON.stringify(S)); }catch(e){}
  }
}
function todayStr(){return new Date().toISOString().slice(0,10);}
function handleStreak(){
  const t=todayStr();if(S.lastActive===t)return;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.lastActive===y)S.streak+=1;else S.streak=1;
  S.lastActive=t;saveState();
}

/* ============================================================

   ============================================================ */
const view=document.getElementById("view"),streakEl=document.getElementById("streak"),toastEl=document.getElementById("toast");
let toastTimer=null,toastQueue=[];
function toast(m){toastQueue.push(m);if(!toastTimer)nextToast();}
function nextToast(){if(!toastQueue.length){toastTimer=null;return;}const m=toastQueue.shift();
  toastEl.textContent=m;toastEl.classList.add("show");
  toastTimer=setTimeout(()=>{toastEl.classList.remove("show");setTimeout(nextToast,400);},1900);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function addXP(n){S.xp+=n;}
function speak(text){if(!("speechSynthesis" in window))return;const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}
function updateHeader(){streakEl.textContent="🔥 "+S.streak;}
const POS_INFO={noun:{tr:"İsimler",ic:"🧱"},verb:{tr:"Fiiller",ic:"🏃"},adjective:{tr:"Sıfatlar",ic:"🎨"},
  adverb:{tr:"Zarflar",ic:"⚡"},preposition:{tr:"Edatlar",ic:"🔗"},pronoun:{tr:"Zamirler",ic:"👤"},
  conjunction:{tr:"Bağlaçlar",ic:"➕"},determiner:{tr:"Belirteçler",ic:"📌"},number:{tr:"Sayılar",ic:"🔢"},exclamation:{tr:"Ünlemler",ic:"💬"}};

/* ============================================================
   ROUTER
   ============================================================ */
let currentTab="home";
document.getElementById("nav").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  [...document.querySelectorAll("#nav button")].forEach(x=>x.classList.toggle("active",x===b));
  currentTab=b.dataset.tab;render();
});
function goTab(tab){currentTab=tab;
  [...document.querySelectorAll("#nav button")].forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));render();}
function render(){
  updateHeader();
  if(currentTab==="home")renderHome();
  else if(currentTab==="lessons")renderLessons();
  else if(currentTab==="words")renderWordsMenu();
  else if(currentTab==="game")renderGameMenu();
  else if(currentTab==="ach")renderAch();
  else if(currentTab==="progress")renderProgress();
  document.querySelector("main").scrollTop=0;
}

  const placed=S.level!==null,next=nextLesson();

  if(!placed){
    html+=`<button class="tile" onclick="startPlacement()"><span class="em">🧭</span>
      <span class="t">Seviye Testi</span>
      <span class="s">12 kısa soru. Seviyeni bulalım (A1–B2), sonra sana uygun dersleri açalım.</span></button>`;
  }else{
    html+=`<div class="tile-row tile" onclick="goTab('lessons')"><span class="em">📘</span>

      <div class="s">${next?"Sıradaki: "+next.title:"Tüm dersleri bitirdin! 🎉"}</div></div></div>`;
    if(next)html+=`<button class="btn btn-primary" onclick="openLesson('${next.id.split('-')[0]}','${next.id}')">Derse başla →</button>`;
    html+=`<button class="btn btn-leaf btn-sm" onclick="goTab('words')">📖 Kelime çalış (Oxford 3000)</button>
      <button class="btn btn-sun btn-sm" onclick="startSentence()">🧩 Cümle kurma</button>
      <button class="btn btn-ghost btn-sm" onclick="startListen()">🎧 Dinleme</button>
      <button class="btn btn-ghost btn-sm" onclick="startSpell()">🔤 Yazma / heceleme</button>
      <button class="btn btn-ghost btn-sm" onclick="goTab('progress')">💌 İrem için ilerleme kodu</button>`;
  }
  view.innerHTML=html;
}

/* ---------- LESSONS ---------- */
function nextLesson(){
  if(!S.level)return null;
  const s=LEVEL_ORDER.indexOf(S.level);
  for(let li=s;li<LEVEL_ORDER.length;li++)for(const les of LESSONS[LEVEL_ORDER[li]])if(!S.lessonsDone.includes(les.id))return les;
  return null;
}
function renderLessons(){
  if(!S.level){view.innerHTML=`<h1>Dersler</h1><p class="muted">Önce kısa seviye testini yapalım.</p><div class="sp"></div>
    <button class="btn btn-primary" onclick="startPlacement()">🧭 Seviye testi</button>`;return;}
  let html=`<h1>Dersler</h1><p class="muted">Seviyen: <b>${S.level} · ${LEVEL_NAME[S.level]}</b>. Her derste önce anlatım, sonra 8-10 alıştırma var.</p><div class="sp"></div>`;
  LEVEL_ORDER.forEach(lv=>{
    html+=`<h2 style="margin-top:14px">${lv} · ${LEVEL_NAME[lv]}</h2>`;
    LESSONS[lv].forEach(les=>{
      const done=S.lessonsDone.includes(les.id);
      html+=`<button class="tile tile-row" onclick="openLesson('${lv}','${les.id}')"><span class="em">${done?"✅":"📖"}</span>
        <div class="grow"><div class="t">${les.title}</div><div class="s">${les.teach.length} anlatım · ${les.ex.length} alıştırma</div></div>
        <span class="badge-pill ${done?"":"todo"}">${done?"Bitti":"+20 XP"}</span></button>`;
    });
  });
  html+=`<div class="sp"></div><button class="btn btn-ghost btn-sm" onclick="startSentence()">🧩 Cümle kurma alıştırması</button>`;
  view.innerHTML=html;
}
let curLesson=null,teachIdx=0,exIdx=0,exScore=0;
function openLesson(lv,id){curLesson=LESSONS[lv].find(l=>l.id===id);teachIdx=0;exIdx=0;exScore=0;renderTeach();}
function renderTeach(){view.classList.remove("vcenter");
  const t=curLesson.teach[teachIdx];let ex="";
  if(t.exs)t.exs.forEach(e=>ex+=`<div class="ex"><div class="en">${e.en}</div><div class="tr">${e.tr}</div></div>`);
  view.innerHTML=`<button class="back" onclick="goTab('lessons')">← Derslere dön</button>
    <div class="qlabel">${curLesson.title.toUpperCase()} · ANLATIM ${teachIdx+1}/${curLesson.teach.length}</div>
    <div class="progress"><div class="progress-bar" style="width:${teachIdx/curLesson.teach.length*40}%"></div></div>
    <div class="teach"><h3>${t.h}</h3><p>${t.p}</p>${t.rule?`<div class="rule">📌 ${t.rule}</div>`:""}${ex}${t.tip?`<div class="tip">💡 ${t.tip}</div>`:""}</div>
    <button class="btn btn-primary" onclick="teachNext()">${teachIdx<curLesson.teach.length-1?"Devam →":"Alıştırmalara geç →"}</button>`;
}
function teachNext(){if(teachIdx<curLesson.teach.length-1){teachIdx++;renderTeach();}else{exIdx=0;exScore=0;renderEx();}}
function renderEx(){view.classList.remove("vcenter");
  const q=curLesson.ex[exIdx],opts=shuffle(q.opts.map((t,i)=>({t,correct:i===q.a})));
  view.innerHTML=`<button class="back" onclick="goTab('lessons')">← Çık</button>
    <div class="qlabel">ALIŞTIRMA · ${exIdx+1}/${curLesson.ex.length}</div>
    <div class="progress"><div class="progress-bar" style="width:${40+exIdx/curLesson.ex.length*60}%"></div></div>
    <div class="qcard"><div class="qword small">${q.q.replace("___",'<span class="blank"> ? </span>')}</div>
    <div class="opts" id="opts"></div><div class="explain" id="explain"></div></div><div id="exNext"></div>`;
  const o=document.getElementById("opts"),ex=document.getElementById("explain");
  opts.forEach(op=>{const b=document.createElement("button");b.className="opt";b.textContent=op.t;
    b.onclick=()=>{[...o.children].forEach(x=>x.disabled=true);
      if(op.correct){b.classList.add("correct");exScore++;}else{b.classList.add("wrong");[...o.children].find(x=>x.textContent===q.opts[q.a])?.classList.add("correct");}
      ex.innerHTML="💡 "+q.ex;ex.classList.add("show");
      const w=document.getElementById("exNext"),nb=document.createElement("button");
      nb.className="btn btn-primary";nb.textContent=exIdx<curLesson.ex.length-1?"Devam →":"Dersi bitir →";
      nb.onclick=()=>{exIdx<curLesson.ex.length-1?(exIdx++,renderEx()):finishLesson();};w.appendChild(nb);
    };o.appendChild(b);});
}
function finishLesson(){
  const first=!S.lessonsDone.includes(curLesson.id);

  const total=curLesson.ex.length,pct=Math.round(exScore/total*100);
  view.innerHTML=`<div class="result"><div class="big">${pct>=80?"🌟":pct>=50?"👍":"💪"}</div>
    <h2>${exScore} / ${total} doğru</h2><p class="muted">${first?"+20 XP kazandın!":"Tekrar da iyidir 👏"}<br>${iremCheer(pct)}</p><div class="sp"></div>

    <button class="btn btn-ghost" onclick="goTab('lessons')">Derslere dön</button></div>`;
}

/* ---------- SENTENCE BUILDING ---------- */
let senQueue=[],senIdx=0,senCorrect=0,senBuild=[],senTarget=[];
function startSentence(){
  const lv=S.level||"A1";
  senQueue=shuffle(SENTENCES[lv]).slice(0,8);senIdx=0;senCorrect=0;renderSentence();
}
function renderSentence(){view.classList.remove("vcenter");
  const item=senQueue[senIdx];
  senTarget=item.s.split(" ");
  senBuild=[];
  const bank=shuffle(senTarget.map((w,i)=>({w,i})));
  view.innerHTML=`<button class="back" onclick="goTab('home')">← Çık</button>
    <div class="qlabel">CÜMLE KUR · ${senIdx+1}/${senQueue.length} · ✅ ${senCorrect}</div>
    <div class="progress"><div class="progress-bar" style="width:${senIdx/senQueue.length*100}%"></div></div>
    <div class="qcard">
      <div class="qlabel">Türkçesi</div>
      <div class="qword small" style="margin-top:6px">${item.tr}</div>
      <div class="build-area" id="build"></div>
      <div class="bank" id="bank"></div>
      <div class="feedbar" id="feed"></div>
    </div>
    <div id="senNext"></div>`;
  const bankEl=document.getElementById("bank");
  bank.forEach(tok=>{
    const c=document.createElement("button");c.className="chip";c.textContent=tok.w;c.dataset.k=tok.i;
    c.onclick=()=>addChip(tok,c);bankEl.appendChild(c);
  });
}
function addChip(tok,el){
  if(el.classList.contains("used"))return;
  el.classList.add("used");
  senBuild.push({tok,el});
  redrawBuild();
  if(senBuild.length===senTarget.length)checkSentence();
}
function redrawBuild(){
  const b=document.getElementById("build");b.innerHTML="";
  senBuild.forEach((it,idx)=>{
    const c=document.createElement("button");c.className="chip inbuild";c.textContent=it.tok.w;
    c.onclick=()=>{it.el.classList.remove("used");senBuild.splice(idx,1);redrawBuild();document.getElementById("feed").textContent="";};
    b.appendChild(c);
  });
}
function checkSentence(){
  const made=senBuild.map(x=>x.tok.w).join(" ");
  const target=senTarget.join(" ");
  const feed=document.getElementById("feed");
  const ok=made.toLowerCase()===target.toLowerCase();
  if(ok){senCorrect++;feed.textContent="✅ Doğru!";feed.className="feedbar ok";speak(target);}
  else{feed.textContent="❌ Sıra yanlış. Doğrusu: "+target;feed.className="feedbar no";}
  document.querySelectorAll("#bank .chip").forEach(c=>c.style.pointerEvents="none");
  document.querySelectorAll("#build .chip").forEach(c=>c.style.pointerEvents="none");
  const w=document.getElementById("senNext");w.innerHTML="";
  const nb=document.createElement("button");nb.className="btn btn-primary";
  nb.textContent=senIdx<senQueue.length-1?"Devam →":"Sonucu gör →";
  nb.onclick=()=>{senIdx<senQueue.length-1?(senIdx++,renderSentence()):finishSentence();};
  w.appendChild(nb);
}
function finishSentence(){
  S.sentencesDone+=senQueue.length;S.correctTotal+=senCorrect;addXP(senCorrect*3);
  saveState();checkAchievements();
  const pct=Math.round(senCorrect/senQueue.length*100);
  view.innerHTML=`<div class="result"><div class="big">${pct>=80?"🧩":pct>=50?"👍":"💪"}</div>
    <h2>${senCorrect} / ${senQueue.length} doğru</h2><p class="muted">+${senCorrect*3} XP<br>${iremCheer(pct)}</p><div class="sp"></div>
    <button class="btn btn-sun" onclick="startSentence()">Tekrar</button>
    <button class="btn btn-ghost" onclick="goTab('home')">Ana sayfa</button></div>`;
}

function renderGameMenu(){
  view.innerHTML=`<h1>Kelime Oyunu</h1><p class="muted">Resimlerle 100+ günlük kelime. Cevaba dokun, otomatik geçer.</p><div class="sp"></div>

      <span class="t">İngilizce → Türkçe</span><span class="s">İngilizce kelimeyi gör, Türkçesini tahmin et. 🔊</span></button>
    <button class="tile" onclick="startGame('tr2en')"><span class="em">🇹🇷 → 🇬🇧</span>
      <span class="t">Türkçe → İngilizce</span><span class="s">Türkçe kelimeyi gör, İngilizcesini tahmin et.</span></button>`;
}
let gMode="en2tr",gQueue=[],gIdx=0,gCorrect=0,gAnswered=false;const GAME_Q=12;
function startGame(m){gMode=m;gQueue=shuffle(VOCAB).slice(0,GAME_Q);gIdx=0;gCorrect=0;renderGame();}
function renderGame(){view.classList.remove("vcenter");
  gAnswered=false;const q=gQueue[gIdx],askEn=gMode==="en2tr",correct=askEn?q.tr:q.en;
  const pool=shuffle(VOCAB.filter(w=>w!==q)),distr=[];
  for(const w of pool){const v=askEn?w.tr:w.en;if(v!==correct&&!distr.includes(v))distr.push(v);if(distr.length===3)break;}
  const opts=shuffle([correct,...distr]);
  view.innerHTML=`<button class="back" onclick="goTab('game')">← Çık</button>
    <div class="qlabel">${askEn?"İNGİLİZCE":"TÜRKÇE"} · ${gIdx+1}/${gQueue.length} · ✅ ${gCorrect}</div>
    <div class="progress"><div class="progress-bar" style="width:${gIdx/gQueue.length*100}%"></div></div>
    <div class="qcard"><div class="qpic">${q.img}</div><div class="qword">${askEn?q.en:q.tr}</div>
    ${askEn?`<button class="say" onclick="speak('${q.en.replace(/'/g,"\\'")}')">🔊 Say it</button>`:""}
    <div class="opts" id="opts"></div></div>`;
  const o=document.getElementById("opts");
  opts.forEach(v=>{const b=document.createElement("button");b.className="opt";b.textContent=v;
    b.onclick=()=>{if(gAnswered)return;gAnswered=true;
      [...o.children].forEach(x=>{x.disabled=true;if(x.textContent===correct)x.classList.add("correct");else x.classList.add("dim");});
      if(v===correct){gCorrect++;if(askEn)speak(q.en);}else{b.classList.remove("dim");b.classList.add("wrong");}
      setTimeout(()=>{gIdx<gQueue.length-1?(gIdx++,renderGame()):finishGame();},900);
    };o.appendChild(b);});
}
function finishGame(){
  S.gamesPlayed++;S.correctTotal+=gCorrect;addXP(gCorrect*2);
  const perfect=gCorrect===gQueue.length;if(perfect)S.perfectRounds++;
  saveState();checkAchievements();
  const pct=Math.round(gCorrect/gQueue.length*100);
  view.innerHTML=`<div class="result"><div class="big">${perfect?"🏆":pct>=60?"👍":"💪"}</div>
    <h2>${gCorrect} / ${gQueue.length} doğru</h2><p class="muted">+${gCorrect*2} XP ${perfect?"· Kusursuz! ⭐":""}<br>${iremCheer(pct)}</p><div class="sp"></div>
    <button class="btn btn-leaf" onclick="startGame('${gMode}')">Tekrar oyna</button>
    <button class="btn btn-ghost" onclick="goTab('game')">Mod seç</button></div>`;
}

let sQueue=[],sIdx=0,sCorrect=0,sAnswered=false,hintLevel=0;const SPELL_Q=10;
function startSpell(){sQueue=shuffle(SPELL_WORDS).slice(0,SPELL_Q);sIdx=0;sCorrect=0;renderSpell();}
function renderSpell(){view.classList.remove("vcenter");
  sAnswered=false;hintLevel=0;const q=sQueue[sIdx];
  view.innerHTML=`<button class="back" onclick="goTab('home')">← Çık</button>
    <div class="qlabel">YAZMA · ${sIdx+1}/${sQueue.length} · ✅ ${sCorrect}</div>
    <div class="progress"><div class="progress-bar" style="width:${sIdx/sQueue.length*100}%"></div></div>
    <div class="qcard"><div class="qpic">${q.img}</div><div class="qlabel">Türkçesi: ${q.tr}</div>
      <button class="say" onclick="speak('${q.en.replace(/'/g,"\\'")}')">🔊 Dinle</button>
      <input class="spell-in" id="spellIn" placeholder="İngilizce yaz..." autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
      <div class="hint-letters" id="hint"></div><div class="explain" id="explain"></div></div>
    <button class="btn btn-ghost btn-sm" id="hintBtn" style="margin-top:14px" onclick="spellHint()">💡 İpucu (bir harf aç)</button>
    <div id="sNext"></div>`;
  const inp=document.getElementById("spellIn");inp.focus();
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")checkSpell();});
  const w=document.getElementById("sNext"),chk=document.createElement("button");
  chk.className="btn btn-primary";chk.textContent="Kontrol et";chk.onclick=checkSpell;w.appendChild(chk);
}
function spellHint(){const q=sQueue[sIdx];hintLevel=Math.min(hintLevel+1,q.en.length);
  const shown=q.en.slice(0,hintLevel).split("").join(" ");
  const rest=q.en.slice(hintLevel).replace(/./g,"_ ");
  document.getElementById("hint").textContent=(shown+" "+rest).trim();}
function checkSpell(){
  if(sAnswered)return;const q=sQueue[sIdx],inp=document.getElementById("spellIn");
  const val=inp.value.trim().toLowerCase();if(!val)return;
  sAnswered=true;inp.disabled=true;const ex=document.getElementById("explain");
  const correct=val===q.en.toLowerCase();
  if(correct){sCorrect++;inp.style.borderColor="var(--leaf)";ex.innerHTML="✅ Doğru! <b>"+q.en+"</b>";speak(q.en);}
  else{inp.style.borderColor="var(--wrong)";ex.innerHTML="Doğrusu: <b>"+q.en+"</b>";}
  ex.classList.add("show");document.getElementById("hintBtn").style.display="none";
  const w=document.getElementById("sNext");w.innerHTML="";
  const nb=document.createElement("button");nb.className="btn btn-primary";
  nb.textContent=sIdx<sQueue.length-1?"Devam →":"Sonucu gör →";
  nb.onclick=()=>{sIdx<sQueue.length-1?(sIdx++,renderSpell()):finishSpell();};w.appendChild(nb);
}
function finishSpell(){
  S.spellDone+=sQueue.length;S.correctTotal+=sCorrect;addXP(sCorrect*3);saveState();checkAchievements();
  const pct=Math.round(sCorrect/sQueue.length*100);
  view.innerHTML=`<div class="result"><div class="big">${pct>=80?"🔤":pct>=50?"👍":"💪"}</div>
    <h2>${sCorrect} / ${sQueue.length} doğru</h2><p class="muted">+${sCorrect*3} XP<br>${iremCheer(pct)}</p><div class="sp"></div>
    <button class="btn btn-sun" onclick="startSpell()">Tekrar</button>
    <button class="btn btn-ghost" onclick="goTab('home')">Ana sayfa</button></div>`;
}

/* ---------- ACHIEVEMENTS ---------- */
function renderAch(){
  const unlocked=S.achievements.length;
  let html=`<h1>Başarılar</h1><p class="muted">${unlocked} / ${ACHIEVEMENTS.length} rozet · ${S.xp} XP</p><div class="sp"></div>
    <div class="stats"><div class="stat"><div class="n">${S.lessonsDone.length}</div><div class="l">Ders</div></div>
    <div class="stat"><div class="n">${S.gamesPlayed}</div><div class="l">Oyun</div></div>
    <div class="stat"><div class="n">${S.correctTotal}</div><div class="l">Doğru</div></div></div>
    <div class="ach-grid">`;
  ACHIEVEMENTS.forEach(a=>{const g=S.achievements.includes(a.id);
    html+=`<div class="ach ${g?"":"locked"}"><div class="ico">${g?a.ico:"🔒"}</div><div class="nm">${a.nm}</div><div class="ds">${a.ds}</div></div>`;});
  html+=`</div>`;view.innerHTML=html;
}

/* ---------- PROGRESS / İREM ---------- */
function progressCode(){
  const data={v:2,full:S};
  return btoa(unescape(encodeURIComponent(JSON.stringify(data))));
}
function renderProgress(){
  const allDone=S.lessonsDone.length>=totalLessons();
  const code=progressCode();
  let html=`<button class="back" onclick="goTab('home')">← Ana sayfa</button>
    <h1>İrem'in Köşesi 💌</h1>
    <p class="muted">Alperen'in ilerlemesini gör, İrem'e (Claude'a) gönder.</p><div class="sp"></div>
    <div class="stats"><div class="stat"><div class="n">${S.level||"—"}</div><div class="l">Seviye</div></div>
    <div class="stat"><div class="n">${S.lessonsDone.length}/${totalLessons()}</div><div class="l">Ders</div></div>
    <div class="stat"><div class="n">${S.xp}</div><div class="l">XP</div></div></div>`;
  if(allDone){
    html+=`<div class="love"><div class="from">🎉 Harika haber</div>
      <div class="msg">Alperen tüm dersleri bitirdi! Aşağıdaki kodu Claude'a gönderirsen, puanını kaybetmeden yeni seviyeler eklenebilir.</div></div>`;
  }
  html+=`<h2 style="margin-top:8px">İlerleme kodu</h2>
    <p class="muted">Bu kodu kopyala ve sohbete yapıştır. Claude, Alperen'in tüm puanını koruyarak uygulamayı güncelleyebilir.</p>
    <textarea class="codebox" id="codeBox" readonly>${code}</textarea>
    <button class="btn btn-rose" onclick="copyCode()">📋 Kodu kopyala</button>
    <button class="btn btn-ghost" onclick="shareCode()">📤 Paylaş</button>
    <div class="sp"></div><h2>Kod yükle (geri al)</h2>
    <p class="muted">Yeni sürümde eski ilerlemeyi geri yüklemek için kodu buraya yapıştır.</p>
    <textarea class="codebox" id="importBox" placeholder="İlerleme kodunu buraya yapıştır..."></textarea>
    <button class="btn btn-primary" onclick="importCode()">⬆️ İlerlemeyi geri yükle</button>`;
  view.innerHTML=html;
}
function copyCode(){const t=document.getElementById("codeBox");t.select();t.setSelectionRange(0,99999);
  try{document.execCommand("copy");}catch(e){}if(navigator.clipboard){navigator.clipboard.writeText(t.value).catch(()=>{});}toast("📋 Kod kopyalandı");}
function shareCode(){const code=document.getElementById("codeBox").value;const msg="Alperen's English progress:\n\n"+code;
  if(navigator.share){navigator.share({title:"Alperen's English",text:msg}).catch(()=>{});}else copyCode();}
function importCode(){const raw=document.getElementById("importBox").value.trim();if(!raw){toast("Önce kod yapıştır");return;}
  try{const data=JSON.parse(decodeURIComponent(escape(atob(raw))));const restore=data.full||data;
    S={...DEFAULT_STATE,...restore};saveState();checkAchievements();updateHeader();toast("✅ İlerleme geri yüklendi");
    setTimeout(()=>goTab('home'),600);}catch(e){toast("⚠️ Kod okunamadı");}}

/* ---------- BOOT ---------- */
(async function(){await loadState();checkAchievements();render();})();

</script>
</body>
</html>
